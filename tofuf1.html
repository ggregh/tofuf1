<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TofuF1 - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Header fisso in alto */
        #header-top {
            height: 60px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #2d2d2d;
            z-index: 1030;
        }
        /* Layout principale */
        .wrapper {
            display: flex;
            flex: 1;
            position: relative;
        }
        /* Sidebar stretta solo icone */
        #sidebar {
            width: 70px;
            background-color: #181818;
            border-right: 1px solid #2d2d2d;
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            z-index: 1020;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        #sidebar .nav-link {
            color: #a0a0a0;
            font-size: 1.5rem;
            margin-bottom: 20px;
            border-radius: 8px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            color: #ffffff;
            background-color: #2b2b2b;
        }
        /* Contenuto principale */
        #content {
            margin-left: 70px;
            padding: 25px;
            flex: 1;
            width: calc(100% - 70px);
        }
        /* Personalizzazione Card Dashboard */
        .card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            color: #e0e0e0;
        }
        .card-header {
            background-color: #252525;
            border-bottom: 1px solid #2d2d2d;
            font-weight: 600;
        }
        .table {
            color: #e0e0e0;
            border-color: #2d2d2d;
        }
        .table-dark {
            background-color: #1e1e1e;
        }
        .table-hover tbody tr:hover {
            color: #ffffff;
            background-color: #252525;
        }
        .text-muted-custom {
            color: #888888;
        }
    </style>
</head>
<body>

    <header id="header-top" class="px-4 d-flex align-items-center justify-content-between fixed-top">
        <div class="d-flex align-items-center">
            <i class="bi bi-speedometer2 fs-4 text-danger me-2"></i>
            <span class="fs-5 fw-bold text-white tracking-wide">TofuF1 1.1</span>
        </div>
        <div class="text-muted-custom small">
            <span id="last-update">Aggiornamento: In corso...</span>
        </div>
    </header>

    <div class="wrapper">
        <nav id="sidebar">
            <a href="#" class="nav-link active" onclick="switchTab('drivers', event)" title="Classifica Piloti">
                <i class="bi bi-person-badge"></i>
            </a>
            <a href="#" class="nav-link" onclick="switchTab('constructors', event)" title="Classifica Costruttori">
                <i class="bi bi-shield-shaded"></i>
            </a>
            <a href="#" class="nav-link" onclick="switchTab('next-race', event)" title="Prossima Gara">
                <i class="bi bi-flag"></i>
            </a>
            <a href="#" class="nav-link" onclick="switchTab('calendar', event)" title="Calendario Gare">
                <i class="bi bi-calendar3"></i>
            </a>
            <a href="#" class="nav-link" onclick="switchTab('about', event)" title="About & Credits">
                <i class="bi bi-info-circle"></i>
            </a>
        </nav>

        <main id="content">
            <div class="container-fluid">
                <div id="dynamic-view">
                    <div class="text-center py-5">
                        <div class="spinner-border text-danger" role="status"></div>
                        <p class="mt-2 text-muted-custom">Caricamento dati da Jolpica F1...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const currentYear = new Date().getFullYear();
        let globalDataCache = {};

        // Funzione per mappare le nazioni (sia aggettivi che paesi) alle emoji delle bandiere
        function getFlagEmoji(countryName) {
            if (!countryName) return '🏁';
            const countryMap = {
                // Paesi e aggettivi inglesi comuni da Ergast/Jolpica
                'Italy': '🇮🇹', 'Italian': '🇮🇹',
                'Monaco': '🇲🇨', 'Monegasque': '🇲🇨',
                'UK': '🇬🇧', 'Great Britain': '🇬🇧', 'British': '🇬🇧', 'English': '🇬🇧',
                'Spain': '🇪🇸', 'Spanish': '🇪🇸',
                'France': '🇫🇷', 'French': '🇫🇷',
                'Germany': '🇩🇪', 'German': '🇩🇪',
                'Austria': '🇦🇹', 'Austrian': '🇦🇹',
                'Belgium': '🇧🇪', 'Belgian': '🇧🇪',
                'Netherlands': '🇳🇱', 'Dutch': '🇳🇱',
                'Hungary': '🇭🇺', 'Hungarian': '🇭🇺',
                'Azerbaijan': '🇦🇿', 'Azerbaijani': '🇦🇿',
                'Singapore': '🇸🇬', 'Singaporean': '🇸🇬',
                'USA': '🇺🇸', 'United States': '🇺🇸', 'American': '🇺🇸',
                'Mexico': '🇲🇽', 'Mexican': '🇲🇽',
                'Brazil': '🇧🇷', 'Brazilian': '🇧🇷',
                'Australia': '🇦🇺', 'Australian': '🇦🇺',
                'Japan': '🇯🇵', 'Japanese': '🇯🇵',
                'China': '🇨🇳', 'Chinese': '🇨🇳',
                'Bahrain': '🇧🇭', 'Bahraini': '🇧🇭',
                'Saudi Arabia': '🇸🇦', 'Saudi': '🇸🇦',
                'UAE': '🇦🇪', 'Abu Dhabi': '🇦🇪', 'Emirati': '🇦🇪',
                'Qatar': '🇶🇦', 'Qatari': '🇶🇦',
                'Canada': '🇨🇦', 'Canadian': '🇨🇦',
                'Switzerland': '🇨🇭', 'Swiss': '🇨🇭',
                'Thailand': '🇹🇭', 'Thai': '🇹🇭',
                'New Zealand': '🇳🇿', 'New Zealander': '🇳🇿', 'Kiwi': '🇳🇿',
                'Las Vegas': '🇺🇸', 'Miami': '🇺🇸',
                'Argentine': '🇦🇷', 'Argentinian': '🇦🇷',
                'Finnish': '🇫🇮', 'Fin': '🇫🇮'

            };
            return countryMap[countryName] || '🏁';
        }

        // Funzione per formattare la data da AAAA-MM-DD a DD/MM/AAAA
        function formatDate(dateString) {
            if (!dateString) return 'Data TBD';
            const parts = dateString.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateString;
        }

        // Funzione per aggiornare il timestamp nell'header
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('last-update').innerText = `Aggiornato: ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
        }

        // Gestione cambio tab dalla sidebar
        function switchTab(tabId, event) {
            if (event) {
                event.preventDefault();
                document.querySelectorAll('#sidebar .nav-link').forEach(el => el.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }
            renderContent(tabId);
        }

        // Wrapper per effettuare il fetch con gestione errori dettagliata
        async function safeFetch(url) {
            try {
                if (!navigator.onLine) {
                    throw new Error("Dispositivo offline. Controlla la tua connessione a internet.");
                }
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Errore dal server Jolpica (Codice: ${response.status})`);
                }
                return await response.json();
            } catch (error) {
                console.error("Fetch error:", error);
                let reason = error.message;
                if (error.name === 'TypeError' && reason.includes('Failed to fetch')) {
                    reason = "Impossibile raggiungere i server di Jolpica F1 (Potrebbe essere offline o bloccato da CORS/Firewall).";
                }
                throw new Error(reason);
            }
        }

        // Renderizzatore principale delle viste
        async function renderContent(tabId) {
            const container = document.getElementById('dynamic-view');
            
            if (tabId === 'about') {
                container.innerHTML = getAboutHTML();
                return;
            }

            container.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <p class="mt-2 text-muted-custom">Caricamento dati stagione ${currentYear}...</p>
                </div>
            `;

            try {
                if (tabId === 'drivers') {
                    let data = globalDataCache.drivers;
                    if (!data) {
                        const json = await safeFetch(`https://api.jolpi.ca/ergast/f1/${currentYear}/driverstandings.json`);
                        data = json.MRData.StandingsTable.StandingsLists[0]?.DriverStandings || [];
                        globalDataCache.drivers = data;
                    }
                    container.innerHTML = getDriversHTML(data);
                } 
                else if (tabId === 'constructors') {
                    let data = globalDataCache.constructors;
                    if (!data) {
                        const json = await safeFetch(`https://api.jolpi.ca/ergast/f1/${currentYear}/constructorstandings.json`);
                        data = json.MRData.StandingsTable.StandingsLists[0]?.ConstructorStandings || [];
                        globalDataCache.constructors = data;
                    }
                    container.innerHTML = getConstructorsHTML(data);
                } 
                else if (tabId === 'next-race') {
                    let data = globalDataCache.nextRace;
                    if (!data) {
                        const json = await safeFetch(`https://api.jolpi.ca/ergast/f1/${currentYear}/next.json`);
                        data = json.MRData.RaceTable.Races[0] || null;
                        globalDataCache.nextRace = data;
                    }
                    container.innerHTML = getNextRaceHTML(data);
                } 
                else if (tabId === 'calendar') {
                    let data = globalDataCache.calendar;
                    if (!data) {
                        const json = await safeFetch(`https://api.jolpi.ca/ergast/f1/${currentYear}.json`);
                        data = json.MRData.RaceTable.Races || [];
                        globalDataCache.calendar = data;
                    }
                    container.innerHTML = getCalendarHTML(data);
                }
                updateTimestamp();
            } catch (err) {
                container.innerHTML = `
                    <div class="alert alert-danger border-0 bg-dark text-danger p-4 shadow" role="alert">
                        <h4 class="alert-heading fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Impossibile recuperare i dati</h4>
                        <p class="mb-1">Si è verificato un problema durante la comunicazione con Jolpica F1.</p>
                        <hr class="border-secondary">
                        <p class="mb-0 text-muted-custom"><strong>Dettaglio errore:</strong> ${err.message}</p>
                        <button class="btn btn-outline-light btn-sm mt-3" onclick="renderContent('${tabId}')">Riprova</button>
                    </div>
                `;
            }
        }

        // Template HTML per i Piloti (con bandiera nazione pilota e scuderia)
        function getDriversHTML(drivers) {
            let rows = drivers.map(d => {
                const driverFlag = getFlagEmoji(d.Driver.nationality);
                const constructorName = d.Constructors[0]?.name || 'N/A';
                const constructorNat = d.Constructors[0]?.nationality || '';
                const constructorFlag = getFlagEmoji(constructorNat);

                return `
                    <tr>
                        <td class="fw-bold text-center">${d.position}</td>
                        <td>${driverFlag} ${d.Driver.givenName} <strong>${d.Driver.familyName}</strong></td>
                        <td><span class="badge bg-secondary text-dark fw-bold px-2 py-1">${d.Driver.permanentNumber || 'N/A'}</span></td>
                        <td> ${constructorName}</td>
                        <td class="text-end fw-bold text-danger">${d.points}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-person-badge me-2 text-danger"></i> Classifica Piloti (${currentYear})</span>
                        <span class="badge bg-dark border border-secondary">Stagione in corso</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 60px;">Pos</th>
                                        <th>Pilota</th>
                                        <th style="width: 90px;">N° Gara</th>
                                        <th>Scuderia</th>
                                        <th class="text-end">Punti</th>
                                    </tr>
                                </thead>
                                
                                <tbody>${rows || '<tr><td colspan="5" class="text-center py-4">Nessun dato disponibile per questa stagione.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Template HTML per i Costruttori (con bandiera scuderia)
        function getConstructorsHTML(constructors) {
            let rows = constructors.map(c => {
                const flag = getFlagEmoji(c.Constructor.nationality);
                return `
                    <tr>
                        <td class="fw-bold text-center">${c.position}</td>
                        <td>${flag} <strong>${c.Constructor.name}</strong> <span class="text-muted-custom small">(${c.Constructor.nationality})</span></td>
                        <td class="text-end fw-bold text-danger">${c.points}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-shield-shaded me-2 text-danger"></i> Classifica Costruttori (${currentYear})</span>
                        <span class="badge bg-dark border border-secondary">Stagione in corso</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 60px;">Pos</th>
                                        <th>Scuderia</th>
                                        <th class="text-end">Punti</th>
                                    </tr>
                                </thead>
                                <tbody>${rows || '<tr><td colspan="3" class="text-center py-4">Nessun dato disponibile per questa stagione.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Template HTML per la Prossima Gara
        function getNextRaceHTML(race) {
            if (!race) {
                return `<div class="card p-4 text-center"><p class="text-muted-custom mb-0">Nessuna informazione disponibile sulla prossima gara o stagione terminata.</p></div>`;
            }
            const flag = getFlagEmoji(race.Circuit.Location.country);
            const formattedDate = formatDate(race.date);
            return `
                <div class="card shadow-sm">
                    <div class="card-header">
                        <i class="bi bi-flag me-2 text-danger"></i> Prossimo Gran Premio (${currentYear})
                    </div>
                    <div class="card-body p-4">
                        <h3 class="text-white mb-3">${flag} ${race.raceName}</h3>
                        <p class="mb-2"><strong>Circuito:</strong> ${race.Circuit.circuitName}</p>
                        <p class="mb-2"><strong>Località:</strong> ${race.Circuit.Location.locality}, ${race.Circuit.Location.country}</p>
                        <p class="mb-4"><strong>Data Gara:</strong> ${formattedDate} - ${race.time ? race.time : 'Orario TBD'}</p>
                        <a href="${race.url}" target="_blank" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-up-right me-1"></i> Maggiori informazioni su Wikipedia</a>
                    </div>
                </div>
            `;
        }

        // Template HTML per il Calendario Gare
        function getCalendarHTML(races) {
            let rows = races.map(r => {
                const flag = getFlagEmoji(r.Circuit.Location.country);
                const formattedDate = formatDate(r.date);
                return `
                    <tr>
                        <td class="text-center fw-bold">${r.round}</td>
                        <td>${flag} <strong>${r.raceName}</strong></td>
                        <td>${r.Circuit.circuitName}</td>
                        <td>${formattedDate}</td>
                    </tr>
                `;
            }).join('');

            return `
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-calendar3 me-2 text-danger"></i> Calendario Gare (${currentYear})</span>
                        <span class="badge bg-dark border border-secondary">${races.length} GP</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 60px;">Round</th>
                                        <th>Gran Premio</th>
                                        <th>Circuito</th>
                                        <th>Data</th>
                                    </tr>
                                </thead>
                                <tbody>${rows || '<tr><td colspan="4" class="text-center py-4">Calendario non disponibile.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Template HTML per About & Credits
        function getAboutHTML() {
            return `
                <div class="card shadow-sm">
                    <div class="card-header">
                        <i class="bi bi-info-circle me-2 text-danger"></i> About & Credits / Note Legali
                    </div>
                    <div class="card-body p-4">
                        <h4 class="text-white mb-3">TofuF1 Dashboard</h4>
                        <p>Questo applicativo web è un progetto minimale sviluppato esclusivamente a <strong>scopo di studio personale, didattico e di ricerca</strong>. Non possiede alcuna natura commerciale né persegue fini di lucro.</p>
                        
                        <h5 class="text-white mt-4 mb-2">Origine dei Dati e Disclaimer</h5>
                        <p>Tutti i dati relativi alle classifiche, ai piloti, alle scuderie e ai calendari vengono prelevati in tempo reale direttamente tramite le API pubbliche messe a disposizione da <strong>Jolpica F1</strong> (un'alternativa open data basata sul database storico Ergast).</p>
                        <p class="text-muted-custom">Questo sito non è in alcun modo affiliato, associato, autorizzato, sponsorizzato o ufficialmente connesso con la Formula 1, Formula One Management (FOM), Formula One Licensing BV, o con alcuna delle loro società affiliate o controllate. I nomi, i marchi, i loghi e le immagini della Formula 1 appartengono ai rispettivi proprietari e vengono citati esclusivamente a scopo descrittivo e informativo.</p>

                        <h5 class="text-white mt-4 mb-2">Proprietà Intellettuale</h5>
                        <p class="mb-0">Il codice sorgente di questa interfaccia è open source ed è pensato per chi vuole imparare a strutturare chiamate API asincrone in JavaScript vanilla con Bootstrap. Nessun dato proprietario viene memorizzato in locale sui server di hosting.</p>
                    </div>
                </div>
            `;
        }

        // Avvio iniziale automatico sulla tab Piloti
        renderContent('drivers');
    </script>
</body>
</html>
